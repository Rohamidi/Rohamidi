<svg width="1200" height="225" viewBox="0 0 1200 225" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="52" y1="28" x2="1148" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="42%" stop-color="#0A1324"/>
      <stop offset="72%" stop-color="#0D47A1" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B3A5A" stop-opacity="0.12"/>
      <stop offset="18%" stop-color="#4E86B8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#DFF3FF" stop-opacity="1"/>
      <stop offset="82%" stop-color="#4E86B8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1B3A5A" stop-opacity="0.12"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="-120 0; 120 0; -120 0"
        dur="8s"
        repeatCount="indefinite"
      />
    </linearGradient>

    <linearGradient id="lineGradientSoft" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B3A5A" stop-opacity="0.08"/>
      <stop offset="30%" stop-color="#7CC7FF" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#9CDCFE" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#7CC7FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1B3A5A" stop-opacity="0.08"/>
    </linearGradient>

    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7CC7FF" stop-opacity="0.24"/>
      <stop offset="58%" stop-color="#0D47A1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020611" flood-opacity="0.55"/>
    </filter>

    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card -->
  <rect x="52" y="28" width="1096" height="152" rx="26" fill="url(#footerBg)" filter="url(#softShadow)"/>
  <rect x="52.5" y="28.5" width="1095" height="151" rx="25.5" stroke="#1B3A5A" stroke-opacity="0.85"/>

  <!-- Ambient glow -->
  <ellipse cx="600" cy="108" rx="405" ry="86" fill="url(#softGlow)" filter="url(#blurGlow)">
    <animate attributeName="opacity" values="0.5;0.88;0.5" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Title -->
  <text
    x="600"
    y="80"
    text-anchor="middle"
    fill="#EAF6FF"
    style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 26px; font-weight: 650; letter-spacing: 0.2px;"
  >
    Thanks For Visiting
    <animate attributeName="opacity" values="0.9;1;0.9" dur="4.6s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text
    x="600"
    y="112"
    text-anchor="middle"
    fill="#8FB9D8"
    style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 1px;"
  >
    Keep Learning • Keep Building
  </text>

  <!-- Main premium line -->
  <g filter="url(#lineGlow)">
    <path
      d="M110 156 C220 140 315 164 420 154 C530 144 620 166 725 154 C830 142 930 163 1090 150"
      stroke="url(#lineGradient)"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.95"
    >
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 -2; 0 0; 0 2; 0 0"
        dur="8s"
        repeatCount="indefinite"
      />
    </path>
  </g>

  <!-- Soft secondary line -->
  <path
    d="M130 171 C265 161 360 177 500 169 C640 161 760 179 920 167 C995 162 1045 161 1070 159"
    stroke="url(#lineGradientSoft)"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.55"
  >
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 1.5; 0 0; 0 -1.5; 0 0"
      dur="9.5s"
      repeatCount="indefinite"
    />
    <animate attributeName="opacity" values="0.32;0.6;0.32" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Fine accent line -->
  <path
    d="M165 146 C300 151 395 141 525 148 C655 155 760 140 900 148 C980 153 1030 152 1055 151"
    stroke="#7CC7FF"
    stroke-width="1"
    stroke-linecap="round"
    opacity="0.16"
  >
    <animate attributeName="opacity" values="0.10;0.24;0.10" dur="5.5s" repeatCount="indefinite"/>
  </path>

  <!-- Moving highlight dot -->
  <circle r="3.2" fill="#EAF6FF">
    <animateMotion
      dur="8s"
      repeatCount="indefinite"
      keySplines="0.42 0 0.58 1"
      calcMode="spline"
      path="M110 156 C220 140 315 164 420 154 C530 144 620 166 725 154 C830 142 930 163 1090 150"
    />
    <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Moving blue accent dot -->
  <circle r="2.4" fill="#7CC7FF">
    <animateMotion
      dur="10s"
      begin="1.6s"
      repeatCount="indefinite"
      keySplines="0.42 0 0.58 1"
      calcMode="spline"
      path="M130 171 C265 161 360 177 500 169 C640 161 760 179 920 167 C995 162 1045 161 1070 159"
    />
    <animate attributeName="opacity" values="0;0.85;0.85;0" dur="10s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
