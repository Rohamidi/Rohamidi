<svg width="1200" height="190" viewBox="0 0 1200 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="52" y1="26" x2="1148" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="45%" stop-color="#0A1324"/>
      <stop offset="75%" stop-color="#0D47A1" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>

    <linearGradient id="premiumLine" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B3A5A" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#7CC7FF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#DFF3FF"/>
      <stop offset="70%" stop-color="#7CC7FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1B3A5A" stop-opacity="0.15"/>
    </linearGradient>

    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7CC7FF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#0D47A1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020611" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="52" y="26" width="1096" height="128" rx="24" fill="url(#footerBg)" filter="url(#softShadow)"/>
  <rect x="52.5" y="26.5" width="1095" height="127" rx="23.5" stroke="#1B3A5A" stroke-opacity="0.85"/>

  <ellipse cx="600" cy="100" rx="390" ry="74" fill="url(#softGlow)" filter="url(#blurGlow)">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="5.5s" repeatCount="indefinite"/>
  </ellipse>

  <text
    x="600"
    y="76"
    text-anchor="middle"
    fill="#DFF3FF"
    style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 25px; font-weight: 650; letter-spacing: 0.4px;"
  >
    Thanks for visiting
    <animate attributeName="opacity" values="0.88;1;0.88" dur="4.5s" repeatCount="indefinite"/>
  </text>

  <text
    x="600"
    y="103"
    text-anchor="middle"
    fill="#8FB9D8"
    style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 1.1px;"
  >
    keep building • keep learning • keep creating
  </text>

  <path
    d="M100 122 C245 92 355 142 500 116 C650 88 780 135 930 110 C1015 96 1080 104 1100 100"
    stroke="url(#premiumLine)"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.95"
  >
    <animate
      attributeName="d"
      dur="7s"
      repeatCount="indefinite"
      values="
        M100 122 C245 92 355 142 500 116 C650 88 780 135 930 110 C1015 96 1080 104 1100 100;
        M100 116 C245 140 365 88 505 118 C650 150 780 94 930 118 C1015 132 1080 104 1100 110;
        M100 122 C245 92 355 142 500 116 C650 88 780 135 930 110 C1015 96 1080 104 1100 100
      "
    />
  </path>

  <path
    d="M120 132 C300 112 390 132 555 126 C720 120 820 144 1080 122"
    stroke="#7CC7FF"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.22"
  >
    <animate
      attributeName="opacity"
      values="0.16;0.38;0.16"
      dur="5s"
      repeatCount="indefinite"
    />
  </path>

  <circle r="3.5" fill="#DFF3FF">
    <animateMotion
      dur="8s"
      repeatCount="indefinite"
      path="M100 122 C245 92 355 142 500 116 C650 88 780 135 930 110 C1015 96 1080 104 1100 100"
    />
    <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle r="2.6" fill="#7CC7FF">
    <animateMotion
      dur="10s"
      begin="1.8s"
      repeatCount="indefinite"
      path="M120 132 C300 112 390 132 555 126 C720 120 820 144 1080 122"
    />
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="10s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
